[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pineflow-backend"
version = "0.1.0"
description = "Minimal crowd prediction backend skeleton"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
